name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: issuer
          POSTGRES_PASSWORD: issuer
          POSTGRES_DB: issuer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U issuer" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: issuer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test on H2 (PostgreSQL mode)
        run: ./mvnw -B -T 2 verify
      - name: Test on PostgreSQL
        run: ./mvnw -B -T 2 verify
        env:
          ISSUER_TEST_PROFILE: pg
          ISSUER_DB_URL: jdbc:postgresql://localhost:5432/issuer
