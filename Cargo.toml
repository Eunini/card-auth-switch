[workspace]
resolver = "2"
members = ["crates/iso8583", "crates/cardcrypto"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Inioluwa Atanda"]
rust-version = "1.80"

[workspace.dependencies]
iso8583 = { path = "crates/iso8583" }
cardcrypto = { path = "crates/cardcrypto" }
hsm = { path = "crates/hsm" }
switch = { path = "crates/switch" }
anyhow = "1"
thiserror = "2"
bytes = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
des = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
hdrhistogram = "7"
proptest = "1"
tempfile = "3"

[profile.release]
debug = 1
